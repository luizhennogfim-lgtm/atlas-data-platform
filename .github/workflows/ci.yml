name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff) - no services needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check .

  unit-tests:
    name: Unit tests + dbt parse - no services needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (integration tests skip themselves without a database)
        run: pytest -q
      - name: Validate dbt project (parses models, tests and refs; does not connect)
        run: dbt parse --project-dir transformations/dbt_project --profiles-dir transformations/dbt_project

  integration-tests:
    name: Integration tests (PostgreSQL service + dbt)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_only
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATLAS_TEST_DSN: postgresql://atlas:atlas_ci_only@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Pytest including end-to-end pipeline tests
        run: pytest -q
      - name: Smoke run of the full pipeline on the bundled synthetic sample
        env:
          ATLAS_DB_DSN: postgresql://atlas:atlas_ci_only@localhost:5432/atlas_test
        run: python -m pipeline.cli run --label ci_smoke

  dag-tests:
    name: Airflow DAG structure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow with its official constraints
        run: >
          pip install "apache-airflow==2.10.5" "psycopg[binary]==3.2.3" pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
      - run: airflow db migrate
      - name: Run Airflow DAG structure tests
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest -q tests/test_dag.py

  docker:
    name: Docker Compose config and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build
